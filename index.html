<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hassan's AI</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>



<!-- MOBILE MENU BUTTON -->

<button id="menu-btn">
☰
</button>



<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">


<div class="sidebar-logo">
🤖 Hassan AI
</div>



<button id="sidebar-new-chat" class="sidebar-btn">
➕ New Chat
</button>



<button id="theme-toggle" class="sidebar-btn">
🌙 Dark Mode
</button>



<div class="chat-history">

<h4>History</h4>


<div class="history-item active">
💬 Current Chat
</div>


</div>


</div>





<!-- MAIN CHAT AREA -->


<div class="chat-container">



<!-- HEADER -->

<div class="header">


<div class="mobile-title">
Hassan AI
</div>


<div class="logo">
AI
</div>



<div class="header-info">

<h2>
Hassan's AI
</h2>

<span class="status">
🟢 Online
</span>


</div>



<div class="header-buttons">

<button id="new-chat-btn">
New
</button>


<button id="clear-btn">
Clear
</button>


</div>


</div>





<!-- CHAT MESSAGES -->


<div id="chat-box">



<div id="welcome-screen">


<h1>
👋 Welcome to Hassan's AI
</h1>


<p>
Ask anything, get instant answers and explore ideas.
</p>



<div class="suggestion-grid">



<div class="suggestion-card"
onclick="fillPrompt('Explain Artificial Intelligence')">

🤖 Artificial Intelligence

</div>



<div class="suggestion-card"
onclick="fillPrompt('Help me study Biology')">

📚 Study Help

</div>




<div class="suggestion-card"
onclick="fillPrompt('Give me creative project ideas')">

💡 Project Ideas

</div>




<div class="suggestion-card"
onclick="fillPrompt('Motivate me today')">

🚀 Motivation

</div>



</div>



</div>



</div>







<!-- INPUT -->


<div class="input-area">


<input 
id="user-input"
type="text"
placeholder="Message Hassan AI..."
>


<button id="mic-btn">
🎤
</button>



<button onclick="sendMessage()">
➤
</button>



</div>



</div>





<script src="script.js"></script>


</body>

</html>
